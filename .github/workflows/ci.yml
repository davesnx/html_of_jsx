name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      TERM: dumb
      OPAMYES: 1

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 4.14.2
          - 5.4.0
        include:
          - os: windows-latest
            ocaml-compiler: 5.4.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@main
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: |
            oniguruma https://github.com/alan-j-hu/ocaml-oniguruma.git#57c194207d2a0c3d7fbfd302d8e21dd7f17422ea
            textmate-language https://github.com/davesnx/ocaml-textmate-language.git#46ea3bd50d4413797e562b08eb87cb9d5694ca30
            tm-grammars https://github.com/davesnx/tm-grammars.git#7bc690111b6d6a9c6896bc35aa17bfb854c33a2d
            ochre https://github.com/davesnx/ochre.git#f367ec7b372e20fddabc065201cf696564361abe
          with-doc: true
          # Windows and 4.14.2 skip the dev-setup tools.
          with-dev-setup: ${{ runner.os != 'Windows' && matrix.ocaml-compiler != '4.14.2' }}

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache@main
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Build
        env:
          BUILD_DEMO: ${{ (runner.os == 'Windows' || matrix.ocaml-compiler == '4.14.2') && 'false' || 'true' }}
        run: make build

      - name: Check formatting
        if: runner.os != 'Windows'
        run: make format-check

      - name: Run tests
        run: make test

      - name: Save dune cache
        if: ${{ !cancelled() }}
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@main

      - name: Run benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: make bench

      - name: Run benchmarks (JSON output for tracking)
        if: matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: make bench-ci

      - name: Store benchmark result
        if: matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: html_of_jsx Benchmarks v2
          tool: 'customBiggerIsBetter'
          output-file-path: bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '500%'
          fail-on-alert: true
          summary-always: true

      - name: Build docs site
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: make docs-site

      - name: Publish docs site
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: docs/_site/
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            _build/
            _opam/
          retention-days: 1
