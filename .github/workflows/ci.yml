name: CI

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
  schedule:
    - cron: '0 6 * * 1,4'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      TERM: dumb
      OPAMYES: 1

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - 4.14.2
          - 5.4.0
        include:
          - os: windows-latest
            ocaml-compiler: 5.4.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}

      - name: List pins
        id: pins
        shell: bash
        run: |
          {
            echo 'list<<EOF'
            make -s pin-list
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Setup OCaml and dependencies
        uses: ml-in-barcelona/gh-ci-action@v1.2.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          pins: ${{ steps.pins.outputs.list }}
          with-doc: true
          # Windows and 4.14.2 skip the dev-setup tools.
          with-dev-setup: ${{ runner.os != 'Windows' && matrix.ocaml-compiler != '4.14.2' }}

      - name: Load dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/load@v1.2.0

      - name: Build
        env:
          BUILD_DEMO: ${{ (runner.os == 'Windows' || matrix.ocaml-compiler == '4.14.2') && 'false' || 'true' }}
        run: make build

      - name: Check formatting
        if: runner.os != 'Windows'
        run: make format-check

      - name: Run tests
        run: make test

      - name: Save dune cache
        uses: ml-in-barcelona/gh-ci-action/dune-cache/save@v1.2.0

      - name: Build docs site
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        run: make docs-site

      - name: Publish docs site
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: docs/_site/
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest' && matrix.ocaml-compiler == '5.4.0'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            _build/
            _opam/
          retention-days: 1
